# Render Blueprint for the UFO Park API (NestJS + GraphQL + Prisma).
# Render → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for once in the dashboard and never stored in git.
services:
  - type: web
    name: ufopark-api
    runtime: node
    plan: free
    # Same AWS region as the Neon database (us-east-2) keeps queries fast.
    region: ohio
    branch: master
    buildCommand: yarn install --frozen-lockfile --ignore-engines && yarn workspace @ufopark/api build:deploy
    startCommand: yarn workspace @ufopark/api start:prod
    healthCheckPath: /
    # Only redeploy when the API (or the lockfile) changes.
    buildFilter:
      paths:
        - apps/api/**
        - yarn.lock
        - package.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HUSKY
        value: '0'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: BOOKINGS_REDIRECT_URL
        sync: false
